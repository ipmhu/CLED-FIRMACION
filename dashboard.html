<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel | Firma Digital</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>

    <header class="topbar">

        <div>
            <strong>Firma Digital</strong>
        </div>

        <button id="logoutButton">
            Cerrar sesión
        </button>

    </header>


    <main class="dashboard">

        <section class="welcome">

            <p class="eyebrow">
                PANEL INSTITUCIONAL
            </p>

            <h1 id="welcomeTitle">
                Bienvenido
            </h1>

            <p id="userRole">
                Cargando información...
            </p>

        </section>


        <section class="dashboard-grid">

            <article class="dashboard-card">

                <span class="card-icon">📄</span>

                <h2>Documentos</h2>

                <p>
                    Gestiona los documentos que requieren firmas.
                </p>

<button onclick="window.location.href='documents.html'">
    Ver documentos
</button>

            </article>


            <article class="dashboard-card">

                <span class="card-icon">👥</span>

                <h2>Cursos</h2>

                <p>
                    Consulta los cursos y profesores asignados.
                </p>
<button onclick="window.location.href='courses.html'">
    Ver cursos
</button>
                

            </article>


            <article class="dashboard-card">

                <span class="card-icon">✍️</span>

                <h2>Firmas</h2>

                <p>
                    Consulta el estado de las firmas pendientes.
                </p>

                <button>
                    Ver firmas
                </button>

            </article>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="dashboard.js"></script>

</body>

</html>
