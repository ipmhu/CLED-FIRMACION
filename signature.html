si<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Preparar firma | Firma Digital</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>

<header class="topbar">

    <div>
        <strong>Firma Digital</strong>
    </div>

    <button onclick="history.back()">
        Volver
    </button>

</header>


<main class="signature-page">


    <section class="signature-start-card">

        <p class="eyebrow">
            FIRMA ELECTRÓNICA
        </p>


        <h1 id="signatureTitle">
            Cargando...
        </h1>


        <p id="signatureDescription">
            Cargando documento...
        </p>


        <div class="teacher-preview">

            <span>
                Profesor
            </span>

            <strong id="signatureTeacher">
                Cargando...
            </strong>

        </div>


        <div
            id="sessionStatus"
            class="session-status"
        >
            Sesión no iniciada
        </div>


        <div
            id="qrContainer"
            class="qr-container"
        >

            <div class="qr-placeholder">

                <span>QR</span>

                <p>
                    El código aparecerá aquí
                </p>

            </div>

        </div>


<button
    type="button"
    id="startSessionButton"
    class="start-session-button"
>
    Generar código QR
</button>


        <p id="signatureMessage"></p>

    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="supabase.js"></script>

<script src="signature.js"></script>

</body>

</html>
